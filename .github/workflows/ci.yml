name: CI Test & Build Protection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    name: Methodology Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium with OS Dependencies
        run: npx playwright install --with-deps chromium

      - name: Run Methodology Regression Suite (Eisenberg-Noe Clearing Engine)
        run: npm test

      - name: Verify Production Vite Build
        run: npm run build

      - name: Run Playwright Real Browser E2E Gate (Root, Subpath, Chart Lifecycle)
        run: npm run test:e2e
